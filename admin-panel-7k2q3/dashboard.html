<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت | سینماتک</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div class="admin-topbar">
    <h1>پنل مدیریت سینماتک</h1>
    <button class="btn-small" id="logoutBtn">خروج</button>
  </div>

  <!-- Hero editor -->
  <div class="admin-panel">
    <h2>ویرایش بخش هیرو (صفحه اصلی)</h2>
    <div class="form-row">
      <div class="field">
        <label>عنوان کوچک (Kicker)</label>
        <input type="text" id="heroKicker" placeholder="مثلاً: پیشنهاد این هفته">
      </div>
      <div class="field">
        <label>فیلم مرتبط (اختیاری)</label>
        <select id="heroMovieSelect"><option value="">— هیچکدام —</option></select>
      </div>
    </div>
    <div class="field">
      <label>عنوان اصلی هیرو</label>
      <input type="text" id="heroTitle">
    </div>
    <div class="field">
      <label>توضیح هیرو</label>
      <textarea id="heroDesc"></textarea>
    </div>
    <div class="field">
      <label>لینک تصویر پس‌زمینه هیرو</label>
      <input type="text" id="heroBackdrop" placeholder="https://...">
    </div>
    <button class="btn btn-primary" id="saveHeroBtn">ذخیره هیرو</button>
    <p class="status-msg" id="heroStatus"></p>
  </div>

  <!-- Add / edit movie -->
  <div class="admin-panel">
    <h2 id="movieFormTitle">افزودن فیلم/سریال جدید</h2>
    <input type="hidden" id="movieId">
    <div class="form-row">
      <div class="field">
        <label>عنوان</label>
        <input type="text" id="mTitle">
      </div>
      <div class="field">
        <label>ژانر</label>
        <input type="text" id="mGenre" placeholder="مثلاً: درام، اکشن">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>سال</label>
        <input type="text" id="mYear">
      </div>
      <div class="field">
        <label>امتیاز</label>
        <input type="text" id="mRating" placeholder="مثلاً: 8.4">
      </div>
    </div>
    <div class="field">
      <label>خلاصه داستان</label>
      <textarea id="mSynopsis"></textarea>
    </div>
    <div class="form-row">
      <div class="field">
        <label>لینک پوستر</label>
        <input type="text" id="mPoster" placeholder="https://...">
      </div>
      <div class="field">
        <label>لینک تریلر (اختیاری)</label>
        <input type="text" id="mTrailer" placeholder="https://...">
      </div>
    </div>
    <button class="btn btn-primary" id="saveMovieBtn">ذخیره فیلم</button>
    <button class="btn-small" id="cancelEditBtn" style="display:none;">انصراف از ویرایش</button>
    <p class="status-msg" id="movieStatus"></p>
  </div>

  <!-- Movie list -->
  <div class="admin-panel">
    <h2>لیست فیلم‌ها و سریال‌ها</h2>
    <div class="admin-list" id="adminMovieList">
      <p class="empty-note">در حال بارگذاری...</p>
    </div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
