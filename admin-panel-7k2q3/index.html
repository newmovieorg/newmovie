<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ورود مدیریت | نیو مووی</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-card">
    <div class="brand" id="loginBrand"></div>
    <h1>ورود به پنل مدیریت</h1>
    <div class="field">
      <label for="email">ایمیل</label>
      <input type="email" id="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">رمز عبور</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">ورود</button>
    <p class="admin-error" id="loginError"></p>
  </div>
</div>

<script type="module">
  import { LOGO_SVG } from "../js/chrome.js";
  document.getElementById("loginBrand").innerHTML = LOGO_SVG + `<span class="brand-text">سینما<span class="accent">تک</span></span>`;
</script>
<script type="module" src="admin.js"></script>
</body>
</html>
