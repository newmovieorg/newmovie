<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نیو مووی | معرفی فیلم و سریال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">نیو<span>مووی</span></div>
    <nav class="header-nav">
      <a href="index.html">خانه</a>
      <a href="#movies">فیلم‌ها</a>
      <a href="#series">سریال‌ها</a>
    </nav>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="جستجوی فیلم یا سریال...">
      <button id="searchBtn">جستجو</button>
    </div>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <div class="hero-inner">
      <p class="hero-kicker" id="heroKicker">در حال بارگذاری...</p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" id="heroLink" href="#">مشاهده جزئیات</a>
      </div>
    </div>
  </div>
</section>

<main class="wrap">
  <section class="section" id="movies">
    <div class="section-head">
      <h2 class="section-title">تازه‌ترین‌ها</h2>
    </div>
    <div class="chip-row" id="genreChips">
      <button class="chip active" data-genre="all">همه</button>
    </div>
    <div class="grid" id="movieGrid">
      <p class="empty-note">در حال بارگذاری فیلم‌ها...</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">© نیو مووی — فقط معرفی فیلم، بدون آپلود محتوا</div>
</footer>

<script type="module" src="js/site.js"></script>
</body>
</html>
