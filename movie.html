<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات | نیو مووی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-header"></div>

<section class="detail-hero" id="detailHero">
  <div class="wrap">
    <div class="detail-content">
      <div class="detail-poster" id="detailPoster"></div>
      <div>
        <h1 class="detail-title" id="detailTitle">در حال بارگذاری...</h1>
        <div class="detail-tags" id="detailTags"></div>
        <div class="detail-actions">
          <a class="btn btn-ghost" id="trailerLink" href="#" target="_blank" rel="noopener" style="display:none;">▶ تماشای تریلر</a>
          <button class="btn btn-ghost" id="favBtn">افزودن به علاقه‌مندی‌ها</button>
          <button class="btn btn-ghost" id="shareBtn">اشتراک‌گذاری</button>
        </div>
      </div>
    </div>
  </div>
</section>

<main class="wrap detail-body">
  <div class="detail-section">
    <h3>خلاصه داستان</h3>
    <p class="detail-synopsis" id="detailSynopsis"></p>
  </div>

  <div class="detail-section" id="metaSection">
    <h3>اطلاعات بیشتر</h3>
    <div class="meta-grid" id="metaGrid"></div>
  </div>

  <div class="detail-section" id="downloadSection" style="display:none;">
    <h3>لینک‌های دانلود</h3>
    <div class="download-list" id="downloadList"></div>
  </div>

  <div class="detail-section" id="castSection">
    <h3>بازیگران</h3>
    <div class="cast-row" id="castRow"></div>
  </div>

  <div class="detail-section">
    <h3>نظرات و امتیاز کاربران</h3>
    <div id="ratingSummary"></div>
    <div class="comment-list" id="commentList"></div>
    <form class="review-form" id="commentForm">
      <div class="field"><label>ثبت نظر و امتیاز شما</label></div>
      <div class="star-input" id="commentStars"></div>
      <div class="field"><label>نام</label><input type="text" id="commentName" maxlength="40" placeholder="نام شما"></div>
      <div class="field"><textarea id="commentText" maxlength="800" placeholder="نظرت رو بنویس..."></textarea></div>
      <button type="submit" class="btn btn-primary" id="commentSubmitBtn">ثبت نظر</button>
    </form>
  </div>

  <div class="detail-section">
    <h3>پرسش و پاسخ</h3>
    <div class="qna-list" id="qnaList"></div>
    <form class="review-form" id="questionForm">
      <div class="field"><label>سوالت رو بپرس</label></div>
      <div class="field"><label>نام</label><input type="text" id="questionName" maxlength="40" placeholder="نام شما"></div>
      <div class="field"><textarea id="questionText" maxlength="400" placeholder="سوالت درباره این فیلم/سریال..."></textarea></div>
      <button type="submit" class="btn btn-ghost" id="questionSubmitBtn">ارسال سوال</button>
    </form>
  </div>

  <div class="detail-section" id="similarSection">
    <h3>موارد مشابه</h3>
    <div class="hscroll" id="similarGrid"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">© نیو مووی — فقط معرفی فیلم، بدون آپلود محتوا</div>
</footer>

<div id="app-bottomnav"></div>

<script type="module" src="js/movie-detail.js"></script>
</body>
</html>
